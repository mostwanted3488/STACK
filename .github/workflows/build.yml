name: Build STACK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/STACK_artefacts/Release/VST3/STACK.vst3" "dist/STACK.vst3"
          Get-ChildItem -Recurse dist | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: STACK-windows-vst3
          path: dist

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/STACK.vst3 -DestinationPath STACK-windows-vst3.zip -Force
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest STACK-windows-vst3.zip --title "STACK (Windows VST3)" --notes "Automatic build. Unzip and copy STACK.vst3 to C:\Program Files\Common Files\VST3"
